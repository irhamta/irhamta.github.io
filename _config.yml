remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale: "en-US"
title: "Irham T. Andika"
title_separator: "|"
subtitle: "Unlimited Curiosity!" # site tagline that appears below site title in masthead
name: &name "Irham T. Andika"
description: &description "Personal website of Irham T. Andika. I'm an Astronomer with unlimited curiosity!"
url: "https://irhamta.github.io" # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl: # the subpath of your site, e.g. "/blog"
repository: "irhamta/irhamta.github.io" # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser: "/assets/images2/coding.jpg" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo: "/assets/images2/galaxy_icon.png" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title: "Home" # overrides the website title displayed in the masthead, use " " for no title
words_per_minute: 200
comments:
  provider: false
search: true # false (default)
search_full_content: true # false (default)
search_provider: lunr # lunr (default), algolia, google
# SEO Related
google_site_verification: 5OzXF2sE1c53pNOoqs62S327bcHUYJbwuQpjvmAMJLw

# Social Sharing
social:
  links:
    - "https://github.com/irhamta"
    - "https://www.linkedin.com/in/irhamta/"

# Analytics
analytics: false


# Site Author
author:
  name: *name # *name is a YAML reference pointing to the &anchor earlier
  avatar: "/assets/images2/profile2.jpg" # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio: "Astronomer and Data Scientist"
  location: "Munich, DE"
  email: "irham.andika@tum.de"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
    - label: "Website"
      icon: "fas fa-fw fa-link"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/irhamta"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/irhamta/"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/irhamta"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/irhamta/"


# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - node_modules
  - package.json
  - package-lock.json
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  quiet_deps: true
  silence_deprecations:
    - import


# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: # true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
